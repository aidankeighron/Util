---
layout: default
---
{% assign languageFiles = page.path | split: '/' | last %}
{% assign script = languageFiles | split: '.md' | first %}

<article class="article">
  <div class="article-header">
    <div class="article-meta">
      <a class="category-badge" href="{{ site.baseurl }}/assets/Languages/{{ page.language }}">{{ page.language }}</a>
    </div>
    <h1 class="article-title">{{ script }}</h1>
  </div>
  <div class="content">
    {{ content }}
  </div>
</article>
